name: Keep Streamlit app alive

on:
  schedule:
    # Cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://reportgeneratoracb.streamlit.app/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app (wakes it up if hibernated)
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)

              # Si la app está hibernada, pulsar el botón de despertar
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  wake.wait_for(timeout=15000)
                  wake.click()
                  print("App hibernada: botón de wake-up pulsado")
              except Exception:
                  print("App ya activa (sin botón de wake-up)")

              # Dar tiempo a que cargue y abra el websocket
              page.wait_for_timeout(20000)
              print("Título:", page.title())
              browser.close()
