name: Keep Streamlit app alive

on:
  schedule:
    # Cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -sSL -o /dev/null -w "HTTP %{http_code}\n" --fail https://reportgeneratoracb.streamlit.app/
